schema_version: "1.0"
name: Trigger
required:
  - trigger_id
  - trigger_type
  - source
  - target_capability
  - status
  - triggered_at
properties:
  trigger_id: string
  trigger_type: enum[command,natural_language,event,schedule]
  source: string
  target_capability: string
  target_agent: string|null
  project_id: string|null
  phase_id: string|null
  task_id: string|null
  input: object
  context: object
  priority: string
  requested_by: string
  triggered_at: datetime
  trigger_policy_version: string
  execution_id: string|null
  trace_id: string|null
  status: enum[PENDING,WAITING_INPUT,WAITING_CONFIRMATION,READY,RUNNING,SUCCESS,FAILED,BLOCKED,CANCELLED]
