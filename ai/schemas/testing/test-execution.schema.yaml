schema: TestExecutionRecord
version: 1.1
required: [execution_id, test_case_id, task_id, project_id, status]
fields:
  execution_id: string
  task_id: string
  step_id: string
  phase_id: string
  conversation_id: string
  test_case_id: string
  project_id: string
  requirement_id: string
  project_version: string
  frontend_code_version: string
  backend_code_version: string
  environment_version: string
  test_data_version: string
  execution_mode: [automated, manual, mock]
  automation_reason: string
  capability_requirement: string
  capability:
    type: [TOOL, USER_MCP, USER_SKILL, CAPABILITY_AGENT, MODEL, NONE]
    id: string
    name: string
    version: string
    selection_reason: string
  provider_selection_refs: [string]
  input_ref: string
  expected_result: string
  actual_result: string
  status: [PASS, FAIL, BLOCKED, SKIPPED]
  evidence_refs: [string]
  issue_ids: [string]
  started_at: datetime
  ended_at: datetime
  duration_ms: number
  retry_count: number
  human_intervention: boolean
  rework_count: number
  usage:
    input_tokens: number
    output_tokens: number
    cached_tokens: number
    total_tokens: number
    model_cost: number
    tool_cost: number
    mcp_cost: number
    total_cost: number
  run_refs:
    tool_runs: [string]
    mcp_runs: [string]
    skill_usages: [string]
    capability_runs: [string]
    model_runs: [string]
  created_at: datetime
