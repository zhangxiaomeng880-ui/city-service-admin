schema: RoutingDecision
version: 1.0
required: [routing_id, trace_id, trigger, selected_model, policy_versions]
fields:
  routing_id: string
  trace_id: string
  project_id: string
  phase_id: string
  task_id: string
  step_id: string
  capability_id: string
  trigger: string
  user_model_selected: boolean
  default_model_id: string
  policy_versions: object
  model_pool_version: string
  candidates_before_filter: [object]
  candidates_after_filter: [object]
  filtered_reasons: [object]
  strategy: string
  dimension_scores: object
  weights: object
  final_scores: object
  selected_model:
    provider_id: string
    model_id: string
    model_version: string
  expected:
    quality: number
    total_tokens: number
    cost: number
    latency_ms: number
  runtime:
    current_concurrency: number
    available_concurrency: number
    queue_depth: number
    rpm: number
    tpm: number
    budget_remaining_tokens: number
    budget_remaining_cost: number
  actual:
    result: string
    input_tokens: number
    output_tokens: number
    reasoning_tokens: number
    total_tokens: number
    cost: number
    latency_ms: number
    retry_count: number
  quality_result: object
  human_intervention: boolean
  feedback_status: string
  created_at: datetime
