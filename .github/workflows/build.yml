name: Build

on:
  push:
    branches:
      - agent/implement-figma-city-service
  pull_request:
    branches:
      - agent/implement-figma-city-service

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
